[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "coldchain-ai-backend"
version = "0.1.0"
description = "ColdChain AI backend - AI decision support for vaccine cold-chain delivery."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.41",
    "psycopg[binary]==3.2.9",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    "pydantic[email]==2.11.5",
    "alembic==1.16.2",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "PyJWT==2.10.1",
    "bcrypt==4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.2.0",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.9",
    "mypy==1.15.0",
    "pre-commit==4.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "A", "C4", "RET"]
ignore = ["E501", "S101"]  # line length enforced by formatter; asserts allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
